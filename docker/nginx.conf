# Container equivalent of config/nginx.sample -- same front-controller
# routing and fastcgi buffer sizes (GET /v1/domains/export streams a whole
# account), minus TLS and server_name: this container answers plain HTTP on
# 80 and expects TLS, if any, to terminate in front of it (a reverse proxy,
# or an operator who is fine with 127.0.0.1 alone).
#
# Replaces Alpine's stock /etc/nginx/http.d/default.conf outright -- see the
# Dockerfile -- rather than adding a second server block next to it, so
# there is exactly one thing answering :80.
server {
    listen              80;
    root                /app/public;
    index               index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include         fastcgi_params;
        fastcgi_param   SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param   DOCUMENT_ROOT   $realpath_root;
        fastcgi_pass    unix:/run/php/php-fpm.sock;
    }

    fastcgi_buffers     16 16k;
    fastcgi_buffer_size 32k;

    # to stdout/stderr rather than a file nobody inside the container will
    # ever read -- `docker logs` is the only place these are meant to go
    access_log /dev/stdout;
    error_log  /dev/stderr;
}
