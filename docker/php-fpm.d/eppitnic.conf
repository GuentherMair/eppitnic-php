; The container image's only pool -- the Dockerfile removes the base image's
; own default pool config (www.conf/www.conf.default, or docker.conf/
; zz-docker.conf on newer tags) so this is the whole of what
; php-fpm.d/*.conf contributes.
[eppitnic]
user  = www-data
group = www-data

; nginx (running as its own "nginx" user, see /etc/nginx/nginx.conf) connects
; here, not the www-data workers themselves, so the socket is owned for
; nginx's benefit rather than the pool's own.
listen       = /run/php/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode  = 0660

pm                   = dynamic
pm.max_children      = 8
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; php-fpm clears the environment for every worker by default (clear_env =
; yes), which is invisible in testing -- the CLI still sees EPPITNIC_CONFIG_DIR
; and EPPITNIC_VAR_DIR just fine -- and only shows up as a container that
; half-works over HTTP. `clear_env = no` looks like the fix but hands workers
; the *entire* container environment instead (measured on php-fpm 8.5: an
; unrelated SECRET becomes readable through getenv()/phpinfo()/an error dump),
; so name only what this application actually reads. $VAR is expanded from
; php-fpm's own master environment when a worker starts.
env[EPPITNIC_CONFIG_DIR] = $EPPITNIC_CONFIG_DIR
env[EPPITNIC_VAR_DIR]    = $EPPITNIC_VAR_DIR
env[EPPITNIC_DEBUG]      = $EPPITNIC_DEBUG

catch_workers_output    = yes
decorate_workers_output = no
