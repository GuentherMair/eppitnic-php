; Production defaults layered on top of the base image's own php.ini
; (php.ini-production, which docker-php-ext-* leaves untouched). Nothing
; here is EPP-specific; it's what any REST API answering the public internet
; should not ship with left at development defaults.

; a stack trace or an internals dump is not owed to whoever can trigger an
; error -- Middleware::register() and SetupApp already gate their own
; response detail on EPPITNIC_DEBUG (left unset by default, see compose.yaml);
; this keeps PHP's own error output out of the response the same way
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; overridden at runtime by Config::get('region') on every web request
; (public/index.php) before this could matter there; a real default here is
; only for the CLI verbs that touch date() before a session/Config exists
date.timezone = UTC

memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 16M

; compiled into the base image but not turned on there -- see the Dockerfile
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
; the image is rebuilt to change code, not edited in place, so paying for a
; timestamp check on every request buys nothing
opcache.validate_timestamps = 0
