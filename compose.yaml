# One eppitnic instance: the web tier, its scheduler sidecar, and a CLI
# service that never starts on its own. See docs/DOCKER.md for the
# reasoning; compose.multi.yaml.sample is the same shape run twice, for
# two installations on one host.
#
# EPPITNIC_CONFIG_DIR and EPPITNIC_VAR_DIR are baked into the image (see the
# Dockerfile) -- what an instance actually needs to set is where /data lands
# on the host and which port it publishes, below.
#
# None of this provides a database. Each service below carries
#   extra_hosts: ["host.docker.internal:host-gateway"]
# so DB_HOST=host.docker.internal reaches one on the Docker host, Linux
# included (a no-op on engines that already resolve the name, e.g. Docker
# Desktop) -- but a MariaDB bound only to 127.0.0.1 still won't answer:
# traffic from a container arrives over the bridge interface, not loopback,
# so the server needs to listen on that interface too (see docs/DOCKER.md's
# "Reaching a database on the host"). Point DB_HOST at another compose
# service's name instead if the database is a container itself.

services:
  # The only service that declares `build:`. scheduler and eppitnic-cli
  # below share the same `image: eppitnic` without building it themselves --
  # three services building the identical Dockerfile to the identical tag
  # raced each other on the final export/tag step (BuildKit shares the build
  # steps between them but not that last one), so there must be exactly one
  # owner. `docker compose build`/`up --build` builds this one service;
  # the others just start from the image it produces.
  web:
    build: .
    image: eppitnic
    # 8080, not 80: a bare-metal install's nginx-vhost.sample/apache-vhost.sample
    # binds host port 80 directly, and a reverse proxy in front of this
    # container (nginx-proxy.sample/apache-proxy.sample) needs 80 free for
    # its own use too. Change this if 8080 collides with something else on
    # the host; update the proxy sample(s) to match.
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; a no-op where the engine already provides it
    # environment:
    #   EPPITNIC_DEBUG: "true"   # never in production -- see docs/INSTALL.md's "Web server"
    restart: unless-stopped

  # `poll process` every 5 minutes is not optional -- it's the only thing
  # that acts on the registry's passwdReminder, so without it the shared EPP
  # credential expires and every call starts failing. See docker/crontab.
  scheduler:
    image: eppitnic
    command: ["crond", "-f", "-L", "/dev/stdout"]
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Excluded from `docker compose up` by its profile -- reached with
  # `docker compose run --rm eppitnic-cli <verb>...`, or `./eppitnic default
  # <verb>...` via the wrapper. A one-shot container rather than `exec` into
  # a running one: the verbs most worth having here (doctor ownership,
  # doctor epp-password, setup) are wanted precisely when the stack is *not*
  # healthy, and `exec` needs a container already running to attach to --
  # hence also no depends_on.
  #
  # `docker compose run` allocates a TTY by default, which is what lets
  # Cli\Command::confirm() prompt for destructive verbs; add -T for scripted/
  # unattended use, together with --yes on the eppitnic verb itself -- one
  # without the other still refuses (no terminal, not confirmed).
  eppitnic-cli:
    image: eppitnic
    profiles: ["cli"]
    # Keeps tini and entrypoint.sh in front of the verb rather than replacing
    # them: entrypoint.sh is what creates and chowns /data/config and
    # /data/var, and `docker compose run --rm eppitnic-cli setup` on a fresh
    # deployment may well be the first thing that ever touches the volume --
    # Docker hands it over root-owned and empty, and ConfigFile::write()
    # needs the directory to exist and be writable.
    entrypoint: ["/sbin/tini", "--", "/docker/entrypoint.sh", "su-exec", "www-data", "eppitnic"]
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
